services:
    api:
        container_name: finance-manager-api
        init: true
        restart: unless-stopped
        build:
            context: ../../
            dockerfile: ./docker/prd/Dockerfile
        environment:
            CFG_ENVIRONMENT: PRD
        ports:
            - "8000:8000"
        command: [ "uvicorn", "src.infra.fastapi.app:create_app", "--factory", "--host=0.0.0.0", "--port=8000", "--proxy-headers", "--forwarded-allow-ips=*", "--no-server-header", "--timeout-keep-alive=5", "--timeout-graceful-shutdown=20", "--limit-concurrency=1000", "--backlog=2048", "--no-access-log" ]
        cpus: 1.0
        mem_limit: 512m
        pids_limit: 256
        healthcheck:
            test: [ "CMD-SHELL", "curl -fsS --max-time 2 http://localhost:8000/healthz/readiness || exit 1" ]
            interval: 10s
            timeout: 3s
            retries: 3
