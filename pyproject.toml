[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.format]
skip-magic-trailing-comma = false

[tool.ruff.lint]
select = [
    "COM812",
    "E",
    "F",
    "I",
    "B",
    "UP",
]

[tool.ruff.lint.isort]
known-first-party = ["src", "tests"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
exclude = "(^|/)__init__\\.py$"
explicit_package_bases = true
mypy_path = "."
disable_error_code = ["var-annotated"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "src.adapters.input.api.exception_handlers",
    "src.adapters.input.api.middlewares",
    "src.adapters.input.api.routes.docs_route",
    "src.infra.logging.config",
]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["src.infra.settings.models"]
disable_error_code = ["call-arg"]
