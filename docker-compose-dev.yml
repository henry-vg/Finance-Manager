services:
    backend:
        container_name: finance-manager-backend-dev
        init: true
        restart: unless-stopped
        build:
            context: ./finance-manager-backend
            dockerfile: Dockerfile
        env_file:
            - backend.env
        environment:
            ENVIRONMENT: DEV
        ports:
            - "8000:8000"
        healthcheck:
            test: ["CMD-SHELL", "curl -fsS --max-time 2 http://localhost:8000/health || exit 1"]
            interval: 10s
            timeout: 3s
            retries: 3